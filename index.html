const legacyKey='xie-genealogy-edit:'+JSON.stringify(original);
const storageKey='xie-genealogy-master-142354';
let rows=original;
try{

const unusedPlaceholders=new Set();
for(const [id,name] of [['author','本人'],['father','父亲']]){
 const row=rows.find(r=>r[0]===id);
 if(row?.[2]===name&&row[3]==='姓名待补录'&&!rows.some(r=>r[1]===id&&!unusedPlaceholders.has(r[0])))unusedPlaceholders.add(id);
}
rows=rows.filter(r=>!unusedPlaceholders.has(r[0]));
const sourceBoxes=new Set(['P001','P002','P003','P008','P010','P015','P018','P021','P023','P024','P032','P036','P037','P043','P055','P056','P063','P064']);
const isDeceased=row=>row[5]??sourceBoxes.has(row[0]);
 
const chart=document.getElementById('chart'),space=document.getElementById('space'),sheet=document.getElementById('sheet');
let records, root, width, height;
const focusPath=new Set(['P001','P002','P003','P007','P036','P037','P041']);
const focusRoots=new Set(['P007','P041']);
const expanded=new Set(),collapsed=new Set();
function draw(){
chart.replaceChildren();
const deceased=new Set(rows.filter(isDeceased).map(r=>r[0]));
records=new Map(rows.map(([id,parent,name,label,note])=>[id,{id,parent,name,label,note,kids:[]}]));
for(const node of records.values())if(node.parent)records.get(node.parent).kids.push(node);

const visible=new Set();
function filter(node,full=false,depth=0){
 visible.add(node.id);
 const all=!collapsed.has(node.id)&&(full||expanded.has(node.id)||focusRoots.has(node.id));
 node.kids=node.kids.filter(child=>all||(!collapsed.has(node.id)&&(depth<2||node.id==="P003"||node.id==="P037"||focusPath.has(child.id)||traceNodes.has(child.id))));
 for(const child of node.kids)filter(child,all,depth+1);
}
filter(root);
for(const id of records.keys())if(!visible.has(id))records.delete(id);
const pitch=94,gap=14;
function layout(node,depth,left){
 node.y=28+depth*145;
 const noteWidth=node.note||node.label&&node.label!=="姓名待补录"?24:0;
 let right=left;
 for(const child of node.kids){
  layout(child,depth+1,right);
  right+=child.width+gap;
 }
 node.width=Math.max(pitch+noteWidth,node.kids.length?right-left-gap:0);
 node.x=node.kids.length?(node.kids[0].x+node.kids.at(-1).x)/2:left+pitch/2;
 node.height=depth===0?44:48;
}
layout(root,0,76);
for(let y=28,depth=1;y<=Math.max(...[...records.values()].map(n=>n.y));y+=145,depth++){

function wire(x,y,w,h){

 Object.assign(line.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
 chart.append(line);
}
for(const n of records.values())if(n.kids.length){
 const y=n.y+136, x1=Math.min(n.x,n.kids[0].x),x2=Math.max(n.x,n.kids.at(-1).x);
 wire(n.x,n.y+n.height,1,y-n.y-n.height+1);
 wire(x1,y,x2-x1+1,1);
 for(const child of n.kids)wire(child.x,y,1,child.y-y+1);
}
for(const n of records.values()){
 const element=document.createElement('span');
 element.className='person'+(deceased.has(n.id)?' boxed':'')+(n===root?' root':'')+(traceNodes.has(n.id)?' traced':'');
 element.textContent=n===root?'曾祖 '+n.name:n.name;
 element.title=[n.name,n.note].filter(Boolean).join('。');
 Object.assign(element.style,{left:n.x+'px',top:n.y+'px',height:n.height+'px'});
 element.tabIndex=0; element.setAttribute('role','button');
 element.onclick=()=>choosePerson(n.id);
 element.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choosePerson(n.id);}};
 chart.append(element);
 const count=children(n.id).length;
 if(count){
  const toggle=document.createElement('button');
  const reveal=n.kids.length<count&&!expanded.has(n.id);
  toggle.type='button';toggle.className='branch-toggle';toggle.textContent=reveal?'展开':'收起';
  toggle.setAttribute('aria-label',toggle.textContent+n.name+'支系');
  Object.assign(toggle.style,{left:n.x+'px',top:(n.y+n.height+4)+'px'});

  mark.type="button";mark.className="member-note";mark.textContent=note;mark.title=note;
  mark.setAttribute("aria-label",n.name+"的备注："+note);
  Object.assign(mark.style,{left:n.x+(n===root?77:18)+"px",top:n.y+"px"});
  mark.onclick=()=>{relation.value="edit";selectMember(n.id);get("member-note").focus();};
  chart.append(mark);

let zoom=1,fit=false;
function size(value){
 zoom=value;document.getElementById('zoom-value').value=Math.round(zoom*100)+'%';chart.style.transform='scale('+zoom+')';
 space.style.width=width*zoom+'px';space.style.height=height*zoom+'px';
}
function go(id){
 fit=false;size(1);const node=records.get(id);
 sheet.scrollLeft=node.x-sheet.clientWidth/2;
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
function fitChart(){size(Math.min(1,(sheet.clientWidth-2)/width));sheet.scrollLeft=0;}

document.getElementById('normal').onclick=()=>go('P001');
window.addEventListener('resize',()=>{if(fit)fitChart()});
let pinch=null;
function pinchPoint(event){
 const [a,b]=event.touches;
 const bounds=sheet.getBoundingClientRect();
 return [Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
  (a.clientX+b.clientX)/2-bounds.left-sheet.clientLeft,
  (a.clientY+b.clientY)/2-bounds.top-sheet.clientTop];
}
sheet.addEventListener('touchstart',event=>{
 if(event.touches.length!==2)return;
 event.preventDefault();
 pinch=pinchPoint(event)[0];
},{passive:false});
sheet.addEventListener('touchmove',event=>{
 if(event.touches.length!==2||!pinch)return;
 event.preventDefault();
 const [distance,x,y]=pinchPoint(event);
 zoomAt(Math.min(3,Math.max(Math.min(.15,(sheet.clientWidth-2)/width),zoom*distance/pinch)),x,y);
 pinch=distance;
},{passive:false});
for(const type of ['touchend','touchcancel'])sheet.addEventListener(type,()=>{pinch=null;});
function zoomAt(next,x,y){
 const previous=zoom;
 const left=(sheet.scrollLeft+x)/previous,top=(sheet.scrollTop+y)/previous;
 fit=false;
 size(next);
 sheet.scrollLeft=left*next-x;
 sheet.scrollTop=top*next-y;
}
sheet.addEventListener('wheel',event=>{
 if(!event.ctrlKey)return;
 event.preventDefault();
 const bounds=sheet.getBoundingClientRect();
 const delta=event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?sheet.clientHeight:1);
 const minimum=Math.min(0.15,(sheet.clientWidth-2)/width);
 const next=Math.min(3,Math.max(minimum,zoom*Math.exp(-delta*0.002)));
 if(next!==zoom)zoomAt(next,event.clientX-bounds.left-sheet.clientLeft,event.clientY-bounds.top-sheet.clientTop);
},{passive:false});

const get=id=>document.getElementById(id);
const reference=get('reference'),relation=get('relation'),choice=get('parent-choice'),rank=get('rank'),input=get('person-name'),feedback=get('feedback');

const current=()=>rows.find(r=>r[0]===reference.value);
function options(select,items){

}
function refresh(){
 const node=current(),mode=relation.value;
 get('parent-field').hidden=mode!=='grandchild';
 options(choice,children(node[0]));

 get('deceased').checked=mode==='edit'&&isDeceased(node);

}
function rebuild(id){
 draw();selectMember(id);go(records.has(id)?id:rows[0][0]);
}
function selectMember(id){
 cancelDelete();
 reference.value=id;

 get('selected-member').textContent='当前成员：'+current()[2];

}
get('close-editor').onclick=()=>{get('editor').hidden=true;};
relation.onchange=refresh;
get('editor').onsubmit=event=>{
 event.preventDefault();
 if(saving)return;
 const node=current(),mode=relation.value,value=input.value.trim();
 if(!value){feedback.textContent='请输入姓名。';return;}
 const parent=mode==='child'?node[0]:mode==='grandchild'?choice.value:node[1];
 if(!parent&&mode!=='edit'){feedback.textContent=mode==='grandchild'?'请先登记并选择该孙辈的上一代。':'该成员的上一代未列于本谱。';return;}
 const next=rows.map(r=>r.slice());
 const id=mode==='edit'?node[0]:globalThis.crypto?.randomUUID?.()||'n'+Date.now()+'-'+Math.random().toString(36).slice(2);
 const updated=[id,parent,value,mode==='edit'&&node[3]!=='姓名待补录'?node[3]:'',get('member-note').value.trim(),get('deceased').checked];
 if(mode==='edit'&&!parent){next[0]=updated;}
 else{
  if(mode==='edit')next.splice(next.findIndex(r=>r[0]===id),1);
  const siblings=next.filter(r=>r[1]===parent);
  const before=rank.value?siblings[Number(rank.value)-1]:undefined;
  next.splice(before?next.indexOf(before):siblings.length?next.indexOf(siblings.at(-1))+1:next.length,0,updated);
 }
 for(let ancestor=parent;ancestor;ancestor=next.find(r=>r[0]===ancestor)?.[1]){
  collapsed.delete(ancestor);
  if(ancestor===parent)expanded.add(ancestor);
 }
 rows=next;
 save(id);
};
let onlineVersion=null;
let saving=false;
const online=false;
async function loadOnline(){
 if(!online)return;
 const response=await fetch('/api/genealogy',{cache:'no-store'});
 if(!response.ok)throw Error('load');
 const data=await response.json();
 onlineVersion=data.version;
 rows=data.rows;
}
async function save(id){
 if(online){
  if(saving)return;
  saving=true;
  try{
   const response=await fetch('/api/genealogy',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows,version:onlineVersion})});
   if(!response.ok)throw Error(response.status===409?'conflict':'write');
   onlineVersion=(await response.json()).version;
   rebuild(id);feedback.textContent='已保存至在线族谱。';
  }catch(error){
   feedback.textContent=error.message==='conflict'?'在线族谱已有更新。本次修改已下载为存档，请重新打开网页后核对。':'在线保存失败。本次修改已下载为存档。';
   download();
  }finally{saving=false;}
  return;
 }
 let saved=true;
 try{localStorage.setItem(storageKey,JSON.stringify(rows));}catch{saved=false;}
 rebuild(id);
 feedback.textContent=saved?'已保存至当前浏览器，并已发起族谱文件下载。':'已发起族谱文件下载。请保留下载的文件。';
 if(typeof Blob!=='undefined')download();
}
let pendingDelete=null;
function cancelDelete(){
 pendingDelete=null;
 get('confirm-delete').hidden=true;
 get('cancel-delete').hidden=true;
}
get('cancel-delete').onclick=()=>{cancelDelete();feedback.textContent='已取消删除。';};
get('delete-member').onclick=()=>{
 const node=current();
 if(!node[1]){feedback.textContent='曾祖是全谱起点，无法删除。';return;}
 if(children(node[0]).length){feedback.textContent='该成员名下已有后代。若姓名有误，请使用「修改姓名或排行」。';return;}
 pendingDelete=node[0];
 get('confirm-delete').hidden=false;
 get('cancel-delete').hidden=false;

};
get('confirm-delete').onclick=()=>{
 if(saving)return;
 const node=current();
 if(node[0]!==pendingDelete||children(node[0]).length)return;
 cancelDelete();
 rows=rows.filter(row=>row[0]!==node[0]);

};
function snapshotHTML(keepKey=false){
 const snapshot=document.documentElement.cloneNode(true);
 snapshot.setAttribute('data-offline','');
 snapshot.querySelector('#chart').replaceChildren();
 snapshot.querySelector('#book-entry').hidden=false;
 snapshot.querySelector('#reading').hidden=true;
 snapshot.querySelector('#reading').classList.remove('arrive');
 snapshot.querySelector('#editor').hidden=true;
 snapshot.querySelector('#trace-result').hidden=true;
 snapshot.querySelector('#trace').textContent='亲缘追溯';
 snapshot.querySelector('#trace').setAttribute('aria-pressed','false');
 snapshot.querySelector('#confirm-delete').hidden=true;
 snapshot.querySelector('#cancel-delete').hidden=true;
 const script=snapshot.querySelector('script');
 const end=script.textContent.indexOf('\nconst legacyKey');
 script.textContent='\nconst original='+JSON.stringify(rows).replaceAll('<','\\u003c')+';'+script.textContent.slice(end);
 if(!keepKey)script.textContent=script.textContent.replace(/const storageKey=[^;]+;/,"const storageKey='xie-genealogy-archive-"+Date.now()+"';");
 return '<!doctype html>'+snapshot.outerHTML;
}
function download(){
 const url=URL.createObjectURL(new Blob([snapshotHTML()],{type:'text/html;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='谢氏族谱-续谱存档.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
get('download').onclick=download;
const syncStatus=get('sync-status');
get('add-member').onclick=()=>{
 syncStatus.textContent='请选择谱图中的成员，再选择登记关系。';

};
get('save-copy').onclick=download;
let targetFile;
get('save-file').onclick=async()=>{
 if(!window.showSaveFilePicker){
  download();syncStatus.textContent='已下载最新族谱。可用此文件替换原文件。';return;
 }
 try{
  if(!targetFile)targetFile=await window.showSaveFilePicker({suggestedName:'谢氏族谱.html',types:[{description:'族谱网页',accept:{'text/html':['.html']}}]});
  const writer=await targetFile.createWritable();
  await writer.write(snapshotHTML(true));
  await writer.close();
  syncStatus.textContent='已写入 '+targetFile.name+'。';
 }catch(error){
  if(error.name==='AbortError')return;
  targetFile=null;
  download();syncStatus.textContent='原文件写入失败，已下载最新族谱。';
 }
};
let tracing=false,pair=[],traceEdges=[],traceNodes=new Set();
const traceButton=document.getElementById('trace'),traceResult=document.getElementById('trace-result');
function ancestry(id){
 const path=[];
 for(let row=rows.find(r=>r[0]===id);row;row=rows.find(r=>r[0]===row[1]))path.push(row[0]);
 return path;
}
function relationship(a,b,older){
 if(!a)return ['本人','子女','孙辈','曾孙辈','玄孙辈'][b]||'第'+b+'代后裔';
 if(!b)return ['本人','父亲或母亲','祖父母或外祖父母','曾祖辈','高祖辈'][a]||'上溯'+a+'代的直系长辈';
 if(a===1&&b===1)return older?'哥哥或姐姐':'弟弟或妹妹';
 if(a===b){
  if(a===2)return '堂或表'+(older?'兄／姐':'弟／妹');
  return '同辈远亲（共祖上溯'+a+'代）';
 }
 if(a===2&&b===1)return '伯父、叔父、姑母、舅父或姨母';
 if(a===1&&b===2)return '侄辈或外甥辈';
 return '旁系'+(a>b?'长辈':'晚辈')+'（相差'+Math.abs(a-b)+'代）';
}
function redrawTrace(){
 draw();fitChart();
}
function choosePerson(id){
 if(!tracing){selectMember(id);return;}
 if(pair.length===2)pair=[];
 if(pair.includes(id))return;
 pair.push(id);
 traceEdges=[];traceNodes=new Set(pair);
 const name=id=>rows.find(r=>r[0]===id)[2];
 if(pair.length===1){traceResult.textContent='已选 '+name(id)+'，请选择另一位成员。';redrawTrace();return;}
 const [a,b]=pair.map(ancestry);
 const common=a.find(id=>b.includes(id));
 const up=a.indexOf(common),down=b.indexOf(common);
 for(const path of [a.slice(0,up+1),b.slice(0,down+1)]){
  for(const id of path){traceNodes.add(id);collapsed.delete(id);}
 }
 const route=[...a.slice(0,up+1),...b.slice(0,down).reverse()];
 traceEdges=route.slice(1).map((id,i)=>[route[i],id]);
 const order=parent=>rows.filter(r=>r[1]===parent).map(r=>r[0]);
 const older=up&&down&&order(common).indexOf(b[down-1])<order(common).indexOf(a[up-1]);
 const [first,second]=pair.map(name);
 traceResult.replaceChildren();
 for(const [tag,text] of [['strong','亲缘追溯'],['p','共同祖先：'+name(common)],['p',first+'称'+second+'：'+relationship(up,down,older)],['p',second+'称'+first+'：'+relationship(down,up,!older)],['p','称谓依谱系推算，具体用法受性别、亲系及家族习惯影响。']]){
  const entry=document.createElement(tag);entry.textContent=text;traceResult.append(entry);
 }
 redrawTrace();
}
traceButton.onclick=()=>{
 tracing=!tracing;pair=[];traceNodes=new Set();traceEdges=[];
 traceButton.setAttribute('aria-pressed',String(tracing));
 traceButton.textContent=tracing?'结束追溯':'亲缘追溯';
 traceResult.hidden=!tracing;traceResult.textContent=tracing?'请在谱图上依次选择两位成员。':'';
 if(tracing)document.getElementById('editor').hidden=true;
 redrawTrace();
};
function drawTrace(){
 if(!traceEdges.length)return;
 const ns='http://www.w3.org/2000/svg';
 const svg=document.createElementNS(ns,'svg');
 svg.setAttribute('width',width);svg.setAttribute('height',height);
 svg.setAttribute('class','trace-overlay');svg.setAttribute('aria-hidden','true');
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 for(const [from,to] of traceEdges){
  const a=records.get(from),b=records.get(to);
  if(!a||!b)continue;
  const down=b.parent===a.id,parent=down?a:b,child=down?b:a,y=parent.y+136;
  const points=[[parent.x,parent.y+parent.height],[parent.x,y],[child.x,y],[child.x,child.y]];
  if(!down)points.reverse();
  const path='M '+points.map(p=>p.join(' ')).join(' L ');
  const length=points.slice(1).reduce((sum,[x,y],i)=>sum+Math.hypot(x-points[i][0],y-points[i][1]),0);
  const trail=document.createElementNS(ns,'path');
  trail.setAttribute('d',path);trail.setAttribute('class','particle-guide');svg.append(trail);
  if(reduced||!length)continue;
  const duration=length/135,count=Math.max(2,Math.ceil(length/22));
  for(let i=0;i<count;i++){
   const dot=document.createElementNS(ns,'circle');
   dot.setAttribute('r',i%3===0?'4.2':'2.8');
   dot.setAttribute('class',i%3===0?'trace-particle bright':'trace-particle');
   const motion=document.createElementNS(ns,'animateMotion');
   motion.setAttribute('path',path);motion.setAttribute('calcMode','paced');
   motion.setAttribute('dur',duration+'s');motion.setAttribute('begin',(-duration*i/count)+'s');
   motion.setAttribute('repeatCount','indefinite');
   dot.append(motion);svg.append(dot);
  }
 }
 chart.append(svg);
}

const entry=get('book-entry'),reading=get('reading'),openBook=get('open-book');
let opening=false;
openBook.onclick=async()=>{
 if(opening)return;
 opening=true;
 try{await loadOnline();}
 catch{opening=false;openBook.querySelector('.entry-label').textContent='读取失败，点击重试';return;}
 entry.classList.add('opening');
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 window.setTimeout(()=>{
  entry.hidden=true;entry.classList.remove('opening');reading.hidden=false;reading.classList.add('arrive');
  draw();fitChart();
  for(const item of chart.querySelectorAll('.person,.wire,.generation')){
   const tier=Math.max(0,Math.floor((parseFloat(item.style.top)||0)/145));
   item.style.setProperty('--tier',Math.min(tier,8));
  }
  chart.classList.add('ink-in');
  window.setTimeout(()=>chart.classList.remove('ink-in'),1500);
  sheet.focus({preventScroll:true});opening=false;
 },reduced?0:920);
};
get('return-cover').onclick=()=>{reading.hidden=true;reading.classList.remove('arrive');entry.hidden=false;openBook.focus();};
</script>
